name: API Gateway CI/CD

on:
  push:
    branches:
      - dev

  pull_request:
    branches:
      - dev

jobs:
  build-and-deploy:
    name: Build, Test and Deploy API Gateway
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore ApiGateway.sln

      - name: Build solution
        run: dotnet build ApiGateway.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test ApiGateway.sln --configuration Release --no-build --verbosity normal

      - name: Publish API Gateway
        run: dotnet publish ApiGateway/ApiGateway.csproj --configuration Release --output ./publish --runtime win-x86

      - name: Deploy to MonsterASP.NET via WebDeploy
        uses: rasmusbuchholdt/simply-web-deploy@2.1.0
        with:
          website-name: ${{ secrets.WEBSITE_NAME }}
          server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.SERVER_USERNAME }}
          server-password: ${{ secrets.SERVER_PASSWORD }}